name: Deploy

# Runs after CI passes on main. The job executes ON the server via a self-hosted
# GitHub Actions runner labelled `energy-prediction` (see src/deploy/README.md for setup).
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted, energy-prediction]
    environment: production
    # deploy.sh waits (up to DEPLOY_WAIT_MINUTES, default 60) for a running pipeline job or
    # trading cycle to finish before restarting the web service
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Deploy and restart services
        run: bash src/deploy/deploy.sh "$GITHUB_WORKSPACE"

      - name: Health check
        run: |
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:5050/api/jobs > /dev/null; then echo "web is up"; exit 0; fi
            sleep 2
          done
          echo "web did not come up"; sudo journalctl -u energy-prediction-web -n 50 --no-pager; exit 1
